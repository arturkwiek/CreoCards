name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Atrapy – build nie łączy się z Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lokalny Supabase – baza + Auth (schemat auth.users), migracje z supabase/migrations
        run: npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Testy RLS (pgTAP)
        run: npx supabase test db
      - name: Test skryptów backupu (lokalna baza, klucz testowy, bez wysyłki)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client >/dev/null
          age-keygen -o "$RUNNER_TEMP/test.agekey" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/backup-out"
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
          AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/test.agekey")" \
          BACKUP_PREFIX=ci BACKUP_SKIP_UPLOAD=1 BACKUP_OUT_DIR="$RUNNER_TEMP/backup-out" \
            bash scripts/backup/backup.sh
          bash scripts/backup/decrypt-backup.sh "$(ls "$RUNNER_TEMP"/backup-out/*.tar.gz.age)" "$RUNNER_TEMP/test.agekey" "$RUNNER_TEMP/restore"
