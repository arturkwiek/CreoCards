<!doctype html>
<html lang="pl">
  <body style="font-family: Arial, Helvetica, sans-serif; color: #171717; max-width: 480px; margin: 0 auto; padding: 24px">
    <h2 style="color: #7c2d5b; margin-top: 0">Ustaw nowe hasło</h2>
    <p>Otrzymaliśmy prośbę o zmianę hasła do Twojego konta w CreoCards.</p>
    <p style="margin: 32px 0">
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
        style="background: #7c2d5b; color: #ffffff; padding: 14px 24px; border-radius: 10px; text-decoration: none; font-weight: bold"
        >Ustaw nowe hasło</a
      >
    </p>
    <p style="font-size: 13px; color: #555">
      Link jest jednorazowy i wygasa po 24 godzinach. Jeśli to nie Ty prosiłaś o zmianę hasła, zignoruj tę wiadomość – hasło pozostanie bez zmian.
    </p>
  </body>
</html>
